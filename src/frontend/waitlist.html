<!DOCTYPE html>
<html>
<head>
  <title>Waitlist</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; }
    nav { background:#222; padding:12px; }
    nav a { color:#ccc; margin-right:20px; text-decoration:none; font-weight:bold; }
    nav a.active { color:#fff; border-bottom:2px solid #00bfff; }
    nav a:hover { color:#fff; }
    #waitlist { margin-top:20px; font-size:16px; }
  </style>
  <script>
    async function joinWaitlist() {
      const email = document.getElementById('email').value;
      const res = await fetch('/api/seats/waitlist', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json();
      document.getElementById('waitlist').textContent =
        `You are at position ${data.waitlistPosition} in the waitlist.`;
    }

    window.onload = () => {
      document.getElementById('nav-waitlist').classList.add('active');
    };
  </script>
</head>
<body>
  <nav>
    <a href="seat-map.html" id="nav-seat">Seat Map</a>
    <a href="manage-hold.html" id="nav-manage">Manage Hold</a>
    <a href="event-log.html" id="nav-event">Event Log</a>
    <a href="waitlist.html" id="nav-waitlist">Waitlist</a>
  </nav>

  <h1>Waitlist</h1>
  <input id="email" placeholder="Enter your email">
  <button onclick="joinWaitlist()">Join Waitlist</button>
  <div id="waitlist"></div>
</body>
</html>
