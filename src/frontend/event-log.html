<!DOCTYPE html>
<html>
<head>
  <title>Event Log</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; }
    nav { background:#222; padding:12px; }
    nav a { color:#ccc; margin-right:20px; text-decoration:none; font-weight:bold; }
    nav a.active { color:#fff; border-bottom:2px solid #00bfff; }
    nav a:hover { color:#fff; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background-color: #f4f4f4; }
  </style>
  <script>
    async function loadEventLog() {
      const seatFilter = document.getElementById('seatFilter').value;
      const url = seatFilter ? `/api/seats/event-log?seat=${seatFilter}` : '/api/seats/event-log';
      const res = await fetch(url);
      const events = await res.json();
      const tbody = document.getElementById('eventLogBody');
      tbody.innerHTML = '';
      events.forEach(e => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${e.timestamp}</td>
          <td>${e.type}</td>
          <td>${e.seat || '-'}</td>
          <td>${e.email || '-'}</td>
          <td>${e.code || '-'}</td>
        `;
        tbody.appendChild(row);
      });
    }
    setInterval(loadEventLog, 3000);
    window.onload = () => {
      loadEventLog();
      document.getElementById('nav-event').classList.add('active');
    };
  </script>
</head>
<body>
  <nav>
    <a href="seat-map.html" id="nav-seat">Seat Map</a>
    <a href="manage-hold.html" id="nav-manage">Manage Hold</a>
    <a href="event-log.html" id="nav-event">Event Log</a>
    <a href="waitlist.html" id="nav-waitlist">Waitlist</a>
  </nav>

  <h1>Event Log</h1>
  <label>Filter by Seat:</label>
  <input id="seatFilter" type="number" placeholder="Seat number">
  <button onclick="loadEventLog()">Apply Filter</button>

  <table>
    <thead>
      <tr>
        <th>Timestamp</th>
        <th>Event Type</th>
        <th>Seat</th>
        <th>Email</th>
        <th>Hold Code</th>
      </tr>
    </thead>
    <tbody id="eventLogBody"></tbody>
  </table>
</body>
</html>
