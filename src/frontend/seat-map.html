<!DOCTYPE html>
<html>
<head>
  <title>Seat Map</title>
  <style>
    body { font-family: Arial, sans-serif; }
    nav { background:#333; padding:10px; }
    nav a { color:white; margin-right:15px; text-decoration:none; }
    .seat { display:inline-block; width:80px; margin:5px; padding:10px; text-align:center; border-radius:5px; color:white; }
    .available { background-color:green; }
    .held { background-color:orange; }
    .confirmed { background-color:red; }
  </style>
  <script>
    async function loadSeats() {
      const res = await fetch('/api/seats/map');
      const seats = await res.json();
      const container = document.getElementById('seat-map');
      container.innerHTML = '';
      seats.forEach(s => {
        const div = document.createElement('div');
        div.className = `seat ${s.status}`;
        div.textContent = `Seat ${s.seat}\n${s.status}`;
        container.appendChild(div);
      });
    }

    async function placeHold() {
      const email = document.getElementById('email').value;
      const seatNumber = document.getElementById('seatNumber').value;
      const res = await fetch('/api/seats/hold', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, seatNumber: Number(seatNumber) })
      });
      const data = await res.json();
      alert(JSON.stringify(data));
      loadSeats();
    }

    setInterval(loadSeats, 2000);
    window.onload = loadSeats;
  </script>
</head>
<body>
  <nav>
    <a href="seat-map.html">Seat Map</a>
    <a href="manage-hold.html">Manage Hold</a>
    <a href="event-log.html">Event Log</a>
    <a href="waitlist.html">Waitlist</a>
  </nav>

  <h1>Seat Map</h1>
  <div id="seat-map"></div>
  <input id="email" placeholder="Email">
  <input id="seatNumber" type="number" placeholder="Seat Number">
  <button onclick="placeHold()">Place Hold</button>
</body>
</html>
