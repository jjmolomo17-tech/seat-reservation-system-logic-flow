<!DOCTYPE html>
<html>
<head>
  <title>Seat Map</title>
  <script>
    async function loadSeats() {
      const res = await fetch('/api/seats/map');
      const seats = await res.json();
      const container = document.getElementById('seat-map');
      container.innerHTML = '';
      seats.forEach(s => {
        const div = document.createElement('div');
        div.textContent = `Seat ${s.seat}: ${s.status}`;
        container.appendChild(div);
      });
    }

    async function placeHold() {
      const email = document.getElementById('email').value;
      const seatNumber = document.getElementById('seatNumber').value;
      const res = await fetch('/api/seats/hold', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, seatNumber: Number(seatNumber) })
      });
      const data = await res.json();
      alert(JSON.stringify(data));
      loadSeats();
    }

    setInterval(loadSeats, 2000); // Poll every 2 seconds
    window.onload = loadSeats;
  </script>
</head>
<body>
  <h1>Seat Map</h1>
  <div id="seat-map"></div>
  <input id="email" placeholder="Email">
  <input id="seatNumber" type="number" placeholder="Seat Number">
  <button onclick="placeHold()">Place Hold</button>
</body>
</html>
